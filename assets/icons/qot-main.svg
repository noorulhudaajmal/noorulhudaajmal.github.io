<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8fafc" rx="8"/>
  
  <!-- Grid pattern for network -->
  <g stroke="#cbd5e1" stroke-width="0.5" opacity="0.3">
    <line x1="20" y1="40" x2="180" y2="40"/>
    <line x1="20" y1="80" x2="180" y2="80"/>
    <line x1="20" y1="120" x2="180" y2="120"/>
    <line x1="20" y1="160" x2="180" y2="160"/>
    <line x1="40" y1="20" x2="40" y2="180"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="120" y1="20" x2="120" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
  </g>
  
  <!-- Signal wave (representing optical signal) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 30 120 Q 40 100, 50 120 T 70 120 T 90 120 T 110 120 T 130 120 T 150 120 T 170 120"/>
  </g>
  
  <!-- Quality metric circles (representing QoT levels) -->
  <g fill="none" stroke="#7c3aed" stroke-width="1.5">
    <circle cx="50" cy="60" r="12" opacity="0.9"/>
    <circle cx="100" cy="50" r="12" opacity="0.7"/>
    <circle cx="150" cy="70" r="12" opacity="0.5"/>
  </g>
  
  <!-- Data points (representing surrogate predictions) -->
  <g fill="#2563eb">
    <circle cx="50" cy="60" r="3"/>
    <circle cx="100" cy="50" r="3"/>
    <circle cx="150" cy="70" r="3"/>
    <circle cx="75" cy="65" r="2.5"/>
    <circle cx="125" cy="55" r="2.5"/>
  </g>
  
  <!-- Trend line (surrogate model fitting) -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 40 75 L 160 55"/>
  </g>
  
  <!-- Performance indicator bar -->
  <g>
    <!-- Background bar -->
    <rect x="30" y="155" width="140" height="12" fill="#e2e8f0" rx="6"/>
    <!-- Filled portion (representing 98% recall) -->
    <rect x="30" y="155" width="137.2" height="12" fill="#16a34a" rx="6"/>
  </g>
  
  <!-- Accent dots -->
  <g fill="#0891b2" opacity="0.6">
    <circle cx="35" cy="35" r="2"/>
    <circle cx="165" cy="30" r="2"/>
    <circle cx="25" cy="150" r="2"/>
  </g>
</svg>
