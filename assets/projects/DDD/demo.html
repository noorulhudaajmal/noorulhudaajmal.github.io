<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Driver Drowsiness Detector · Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0a121c;
      color: #e8f0f8;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      width: 100%;
      max-width: 1280px;
      padding: 32px 28px 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(22px, 3vw, 34px);
      margin: 0 0 5px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      font-size: 12px;
      color: #7f9ab0;
      margin: 0;
    }
    .badge {
      border: 1px solid #1f3a4e;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 10px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #7f9ab0;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: 1px solid #1f3a4e;
      border-radius: 18px;
      background: #0e1f2e;
      box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 20px;
    }
    .chapters button {
      font: inherit;
      background: #11273a;
      color: #8fa9bf;
      border: 1px solid #1f3a4e;
      border-radius: 10px;
      padding: 16px 12px;
      cursor: pointer;
      text-align: center;
      font-size: 12.5px;
      letter-spacing: 0.2px;
      transition:
        border-color 0.2s,
        background 0.2s,
        color 0.2s;
    }
    .chapters button:hover {
      border-color: #3dd6c4;
      color: #c0d8ea;
    }
    .chapters button:focus-visible {
      outline: 2px solid #3dd6c4;
      outline-offset: 3px;
    }
    .chapters button[aria-current="true"] {
      border-color: #3dd6c4;
      background: #163a44;
      color: #ffffff;
    }
    #caption {
      color: #c4d8e8;
      font-size: 14px;
      min-height: 44px;
      margin: 18px 0 0;
      line-height: 1.7;
      padding: 0 4px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
      font-size: 10px;
      color: #5f7a90;
      letter-spacing: 0.5px;
    }
    @media (max-width: 700px) {
      main {
        padding: 18px 14px 20px;
      }
      .badge {
        display: none;
      }
      .chapters {
        grid-template-columns: repeat(3, 1fr);
      }
      .chapters button {
        padding: 12px 10px;
        font-size: 11.5px;
      }
      #caption {
        font-size: 12px;
      }
      footer {
        display: block;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>
  <main>
    <header>
      <div>
        <h1>Driver Drowsiness Detector</h1>
        <p>Raspberry Pi 4 · Infrared camera · TensorFlow Lite</p>
      </div>
      <!-- <div class="badge">CONCEPTUAL DEMO</div> -->
    </header>
    <canvas
      id="stage"
      width="1600"
      height="900"
      role="img"
      aria-label="Animated project flow: infrared face capture, landmark extraction, two CNNs, weighted drowsiness scoring, buzzer alert, accident footage preservation and model updates."
    ></canvas>
    <nav class="chapters" aria-label="Animation chapters"></nav>
    <p id="caption" aria-live="polite"></p>
    <footer>
      <span>NUST · Bachelor’s capstone · 2025</span>
      <span>Inference stays on-device</span>
    </footer>
  </main>
  <script>
    "use strict";
    const canvas = document.querySelector("#stage"),
      ctx = canvas.getContext("2d");
    const captions = [
      "An infrared camera monitors the driver. Frames are processed locally on a Raspberry Pi 4, even without an internet connection.",
      "OpenCV prepares grayscale frames. Dlib locates 68 facial landmarks so the eye and mouth regions can be cropped for two separate CNNs.",
      "TensorFlow Lite predicts eye closure and yawning. Modified PERCLOS combines rolling signals: 0.75 × eye closure + 0.25 × yawning.",
      "As fatigue builds, the combined score crosses an illustrative alert threshold. The onboard buzzer warns the driver; monitoring continues.",
      "A separate MPU6050 motion sensor detects sudden deceleration above 8 m/s². Recent frames are preserved from the circular buffer to local storage.",
      "When connected, footage can be uploaded for review and updated models downloaded through the Django + React portal. Inference stays on-device.",
    ];
    const names = [
      "Monitor",
      "Extract",
      "Infer & score",
      "Alert",
      "Preserve footage",
      "Improve",
    ];
    const titles = [
      "Always watching. Entirely on-device.",
      "From a face to meaningful features.",
      "Two signals. One fatigue estimate.",
      "Detect fatigue. Alert the driver.",
      "A separate path for accident evidence.",
      "Learn from the road. Update at the edge.",
    ];
    const C = {
      bg: "#0e1f2e",
      card: "#132c40",
      line: "#2a485f",
      muted: "#7f9ab0",
      white: "#e8f0f8",
      teal: "#3dd6c4",
      blue: "#5e9eff",
      amber: "#ffc86b",
      red: "#ff7b7b",
    };
    let t = 0,
      last = 0,
      current = -1;
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)),
      mix = (a, b, p) => a + (b - a) * p;
    function text(s, x, y, size = 22, color = C.white, align = "left") {
      ctx.fillStyle = color;
      ctx.font = `${size >= 30 ? "600" : "400"} ${size}px system-ui, sans-serif`;
      ctx.textAlign = align;
      ctx.fillText(s, x, y);
      ctx.textAlign = "left";
    }
    function box(x, y, w, h, fill = C.card, stroke = C.line, r = 18) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    function path(points, color = C.line, width = 3) {
      ctx.beginPath();
      points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }
    function dot(x, y, r = 5, color = C.teal) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }
    function flow(points, local, color = C.teal) {
      path(points, C.line, 2.5);
      const lengths = points
        .slice(1)
        .map((p, i) => Math.hypot(p[0] - points[i][0], p[1] - points[i][1]));
      const total = lengths.reduce((a, b) => a + b, 0);
      for (let k = 0; k < 3; k++) {
        let d = ((local * 0.25 + k / 3) % 1) * total;
        for (let i = 0; i < lengths.length; i++) {
          if (d <= lengths[i]) {
            const f = d / lengths[i];
            dot(
              mix(points[i][0], points[i + 1][0], f),
              mix(points[i][1], points[i + 1][1], f),
              4.5,
              color,
            );
            break;
          }
          d -= lengths[i];
        }
      }
      const end = points.at(-1),
        prev = points.at(-2),
        a = Math.atan2(end[1] - prev[1], end[0] - prev[0]);
      path(
        [
          [end[0] - 11 * Math.cos(a - 0.5), end[1] - 11 * Math.sin(a - 0.5)],
          end,
          [end[0] - 11 * Math.cos(a + 0.5), end[1] - 11 * Math.sin(a + 0.5)],
        ],
        color,
        2.5,
      );
    }
    function label(k, v, x, y, w = 300, color = C.teal) {
      box(x, y, w, 90);
      text(k, x + 20, y + 28, 14, C.muted);
      text(v, x + 20, y + 64, 25, color);
    }
    function pill(s, x, y, color = C.teal) {
      box(x, y, ctx.measureText(s).width + 40, 38, "#0d2537", color, 19);
      text(s, x + 18, y + 26, 15, color);
    }
    function face(x, y, scale, closure = 0, yawn = 0, landmarks = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = "#5a7a92";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 105, 140, 0, 0, Math.PI * 2);
      ctx.stroke();
      path(
        [
          [-95, 170],
          [-65, 132],
          [65, 132],
          [95, 170],
        ],
        "#5a7a92",
        3,
      );
      for (const ex of [-43, 43]) {
        ctx.beginPath();
        ctx.ellipse(
          ex,
          -30,
          22,
          Math.max(2, 10 * (1 - closure)),
          0,
          0,
          Math.PI * 2,
        );
        ctx.stroke();
        if (closure < 0.8) dot(ex, -30, 5, C.teal);
      }
      path(
        [
          [0, -15],
          [-8, 30],
          [10, 30],
        ],
        "#5a7a92",
        2,
      );
      ctx.beginPath();
      ctx.ellipse(0, 73, 27, 5 + yawn * 25, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (landmarks) {
        for (let i = 0; i < 17; i++) {
          let a = (Math.PI * i) / 16;
          dot(-94 * Math.cos(a), 20 + 109 * Math.sin(a), 2.5);
        }
        for (const ex of [-43, 43])
          for (let i = 0; i < 6; i++) {
            let a = (i * Math.PI) / 3;
            dot(ex + 23 * Math.cos(a), -30 + 10 * Math.sin(a), 3);
          }
        for (let i = 0; i < 20; i++) {
          let a = (i * Math.PI) / 10;
          dot(30 * Math.cos(a), 73 + (7 + yawn * 25) * Math.sin(a), 2.5);
        }
        for (let i = 0; i < 19; i++)
          dot(-68 + (i % 10) * 14, -66 + Math.floor(i / 10) * 18, 2);
      }
      ctx.restore();
    }
    function cameraPanel(
      x,
      y,
      w,
      h,
      local,
      closure = 0,
      yawn = 0,
      landmarks = false,
    ) {
      box(x, y, w, h);
      text("IR CAMERA / DRIVER VIEW", x + 24, y + 32, 15, C.muted);
      dot(x + w - 28, y + 26, 5);
      face(x + w / 2, y + h * 0.49, h / 390, closure, yawn, landmarks);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + 10, y + 45, w - 20, h - 60);
      ctx.clip();
      const sy = y + 50 + ((local * 0.22) % 1) * (h - 70);
      path(
        [
          [x + 18, sy],
          [x + w - 18, sy],
        ],
        "#3dd6c455",
        2,
      );
      ctx.restore();
      text(
        landmarks
          ? "FACIAL LANDMARKS + REGION CROPS"
          : "INFRARED · LOW-LIGHT CAPABLE",
        x + 24,
        y + h - 22,
        13,
        C.teal,
      );
    }
    function chip(x, y) {
      box(x, y, 300, 190);
      box(x + 22, y + 30, 90, 100, "#0d2537", C.teal, 10);
      for (let i = 0; i < 4; i++) {
        path(
          [
            [x + 12, y + 47 + i * 22],
            [x + 22, y + 47 + i * 22],
          ],
          C.teal,
        );
        path(
          [
            [x + 112, y + 47 + i * 22],
            [x + 122, y + 47 + i * 22],
          ],
          C.teal,
        );
      }
      text("Pi 4", x + 67, y + 90, 26, C.teal, "center");
      text("EDGE COMPUTE", x + 140, y + 62, 15, C.muted);
      text("Raspberry Pi", x + 140, y + 94, 20);
      text("TFLite inference", x + 140, y + 124, 16, C.muted);
      text("No cloud round trip", x + 25, y + 165, 16, C.teal);
    }
    function node(title, sub, x, y, w = 320, color = C.teal) {
      box(x, y, w, 100);
      dot(x + 24, y + 27, 5, color);
      text(title, x + 42, y + 35, 23);
      text(sub, x + 22, y + 73, 16, C.muted);
    }
    function draw(scene, local) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, 1600, 900);
      for (let x = 40; x < 1600; x += 40)
        for (let y = 40; y < 900; y += 40) dot(x, y, 1, "#1a3247");
      text(`0${scene + 1} / SYSTEM WALKTHROUGH`, 60, 62, 16, C.teal);
      text(titles[scene], 60, 120, 38);
      text("DRIVER DROWSINESS DETECTION", 1540, 61, 14, C.muted, "right");
      if (scene === 0) {
        cameraPanel(65, 180, 540, 520, local, 0.2 + 0.15 * Math.sin(local * 3));
        flow(
          [
            [605, 425],
            [820, 425],
          ],
          local,
        );
        chip(820, 330);
        label("CAPTURE", "Continuous IR frames", 1190, 270, 340);
        label("COMPUTE", "On-device inference", 1190, 390, 340);
        label("CONNECTIVITY", "Works offline", 1190, 510, 340);
        pill("Camera → preprocessing → inference → alert", 75, 748);
      }
      if (scene === 1) {
        cameraPanel(65, 190, 505, 520, local, 0.15, 0.15, true);
        flow(
          [
            [570, 430],
            [670, 430],
            [670, 300],
            [775, 300],
          ],
          local,
        );
        flow(
          [
            [670, 430],
            [670, 560],
            [775, 560],
          ],
          local,
          C.blue,
        );
        box(775, 220, 310, 160);
        text("EYE REGIONS", 800, 254, 16, C.teal);
        for (let x of [855, 1000]) {
          ctx.beginPath();
          ctx.ellipse(x, 310, 45, 18, 0, 0, Math.PI * 2);
          ctx.strokeStyle = C.teal;
          ctx.stroke();
          dot(x, 310, 8);
        }
        box(775, 480, 310, 160);
        text("MOUTH REGION", 800, 514, 16, C.blue);
        ctx.beginPath();
        ctx.ellipse(930, 570, 55, 25, 0, 0, Math.PI * 2);
        ctx.strokeStyle = C.blue;
        ctx.stroke();
        flow(
          [
            [1085, 300],
            [1170, 300],
          ],
          local,
        );
        flow(
          [
            [1085, 560],
            [1170, 560],
          ],
          local,
          C.blue,
        );
        node("CNN 1", "Eye-state classifier", 1170, 250, 355);
        node("CNN 2", "Yawning classifier", 1170, 510, 355, C.blue);
        text(
          "OpenCV grayscale preparation · Dlib 68-point model · cropped and resized inputs",
          75,
          765,
          23,
          C.muted,
        );
      }
      if (scene === 2 || scene === 3) {
        const p = scene === 2 ? clamp(local / 8) : 1;
        const eye =
          scene === 2 ? mix(0.12, 0.65, p) : mix(0.65, 0.9, clamp(local / 5));
        const yawn =
          scene === 2 ? mix(0.05, 0.48, p) : mix(0.48, 0.8, clamp(local / 5));
        const score = 0.75 * eye + 0.25 * yawn;
        const alarm = score > 0.7;
        cameraPanel(65, 190, 440, 490, local, eye, yawn);
        label(
          "CNN 1 / ROLLING EYE-CLOSURE SIGNAL",
          `${Math.round(eye * 100)}%`,
          565,
          210,
          460,
        );
        label(
          "CNN 2 / ROLLING YAWNING SIGNAL",
          `${Math.round(yawn * 100)}%`,
          565,
          330,
          460,
          C.blue,
        );
        box(565, 460, 460, 200);
        text("MODIFIED PERCLOS", 590, 495, 16, C.muted);
        text("0.75 × eye + 0.25 × yawn", 590, 540, 24);
        text(
          `Score   ${score.toFixed(2)}`,
          590,
          600,
          36,
          alarm ? C.amber : C.teal,
        );
        box(1090, 210, 435, 450);
        text("FATIGUE ESTIMATE", 1115, 253, 18, C.muted);
        box(1130, 305, 350, 28, "#0a1a26", C.line, 14);
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(1130, 305, 350 * score, 28, 14);
        ctx.fillStyle = alarm ? C.amber : C.teal;
        ctx.fill();
        ctx.restore();
        path(
          [
            [1375, 292],
            [1375, 350],
          ],
          C.amber,
          3,
        );
        text("0", 1130, 370, 16, C.muted);
        text("1", 1480, 370, 16, C.muted, "right");
        text("0.70 demo threshold", 1115, 410, 18, C.amber);
        text(
          alarm ? "BUZZER ACTIVE" : "MONITORING",
          1115,
          480,
          29,
          alarm ? C.amber : C.teal,
        );
        if (alarm) {
          for (let i = 0; i < 3; i++) {
            ctx.globalAlpha = 0.3 + 0.6 * ((local * 0.8 + i / 3) % 1);
            ctx.beginPath();
            ctx.arc(1300, 555, 25 + i * 18, -1.1, 1.1);
            ctx.strokeStyle = C.amber;
            ctx.lineWidth = 5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          text("Alert driver → continue monitoring", 1115, 625, 18, C.amber);
        } else
          text("Combine signals over a rolling window", 1115, 560, 17, C.muted);
      }
      if (scene === 4) {
        const impact = local >= 2.8;
        node("MPU6050", "Independent accelerometer path", 65, 210, 380);
        flow(
          [
            [445, 260],
            [555, 260],
          ],
          local,
          impact ? C.amber : C.teal,
        );
        node(
          "Sudden deceleration",
          impact ? "9.2 m/s² · trigger exceeded" : "Monitoring vehicle motion",
          555,
          210,
          470,
          impact ? C.amber : C.teal,
        );
        label(
          "DOCUMENTED TRIGGER",
          "Deceleration > 8 m/s²",
          1110,
          215,
          420,
          C.amber,
        );
        box(65, 390, 960, 285);
        text("CIRCULAR VIDEO BUFFER", 90, 432, 20, C.teal);
        for (let i = 0; i < 8; i++) {
          const x = 90 + i * 113;
          box(x, 465, 99, 130, "#0c1f2e", impact ? C.amber : C.line, 8);
          face(x + 50, 523, 0.29, 0.1);
          text(`−${8 - i}`, x + 50, 626, 16, C.muted, "center");
        }
        text(
          impact
            ? "Event detected → preserve recent frames"
            : "Recent frames continuously overwrite the oldest frames",
          90,
          651,
          19,
          impact ? C.amber : C.muted,
        );
        flow(
          [
            [1025, 530],
            [1120, 530],
          ],
          local,
          impact ? C.amber : C.line,
        );
        box(1120, 415, 410, 245);
        text("LOCAL STORAGE", 1145, 463, 21, C.muted);
        text(
          impact ? "FOOTAGE SAVED" : "Ready to preserve",
          1145,
          530,
          29,
          impact ? C.amber : C.teal,
        );
        text("Available for post-incident review", 1145, 587, 17, C.muted);
        text(
          "Accident sensing runs alongside the camera pipeline; it does not require a drowsiness alert.",
          75,
          756,
          22,
          C.muted,
        );
      }
      if (scene === 5) {
        chip(90, 320);
        node("Local footage", "Saved on the device first", 90, 560, 300);
        box(560, 210, 470, 480);
        text("COMPANION PORTAL", 590, 258, 21, C.teal);
        text("Django + React", 590, 304, 30);
        for (let i = 0; i < 3; i++)
          box(590, 345 + i * 38, 170, 22, "#1d3a4e", C.line, 5);
        text("Review footage", 800, 368, 19);
        text("Submit feedback", 800, 410, 19);
        text("Distribute models", 590, 540, 24);
        text("Connection required for sync", 590, 640, 19, C.muted);
        flow(
          [
            [390, 610],
            [480, 610],
            [480, 410],
            [560, 410],
          ],
          local,
        );
        flow(
          [
            [560, 295],
            [470, 295],
            [470, 365],
            [390, 365],
          ],
          local,
          C.blue,
        );
        text("MODEL UPDATE", 390, 270, 14, C.blue);
        text("UPLOAD WHEN CONNECTED", 75, 725, 15, C.teal);
        node(
          "Updated TFLite models",
          "Deploy to on-device inference",
          1130,
          320,
          395,
          C.blue,
        );
        flow(
          [
            [1030, 370],
            [1130, 370],
          ],
          local,
          C.blue,
        );
        label("CORE DESIGN", "Inference stays on-device", 1130, 505, 395);
        text(
          "Connectivity supports improvement. Camera monitoring and alerts remain local.",
          75,
          790,
          23,
          C.muted,
        );
      }
    }
    const chapterButtons = names.map((name, i) => {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => {
        t = i * 8;
        render();
      };
      document.querySelector(".chapters").append(b);
      return b;
    });
    function render() {
      const scene = Math.min(5, Math.floor(t / 8));
      draw(scene, t - scene * 8);
      if (scene !== current) {
        document.querySelector("#caption").textContent = captions[scene];
        chapterButtons.forEach((b, i) =>
          b.setAttribute("aria-current", String(i === scene)),
        );
        current = scene;
      }
    }
    function tick(now) {
      const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
      last = now;
      t += dt;
      if (t >= 48) t = 0;
      render();
      requestAnimationFrame(tick);
    }
    render();
    requestAnimationFrame(tick);
  </script>
</html>
