bio: |
  I'm a Machine Learning Engineer with a Bachelor's in **Software Engineering from NUST** (2023) and have been
  working in data analytics and machine learning since 2022..

  I freelance in data analytics and machine learning and have shipped projects spanning Computer Vision
  pipelines, MLOps workflows, Deep Learning models and full-stack AI and Data Analytics dashboards for clients
  ranging from logistics companies to research labs. In 2022, I completed an internship at the **Optical Networking
  Technologies** Research Lab at NUST, where I worked on applying machine learning to Software-Defined Optical
  Networks, focusing on network path optimization and noise pattern analysis.

  Recently, I've been going deep on Generative AI and agentic systems, learning about designing multi-agent
  pipelines that combine tool use, LLM reasoning and orchestration to automate complex real-world workflows. Computer Vision
  is a long-standing interest and so is the full ML lifecycle i-e clean data pipelines, reproducible experiments
  and models built to work outside the notebook.

interests:
  - Machine learning for optical and communication networks
  - QoT estimation and surrogate modelling of physical systems
  - Robustness, calibration and distribution shift
  - Computer vision under limited and unlabelled data
  - Reliable ML systems and reproducible experimentation

